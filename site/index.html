<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安徽淮北杜集经济开发区 · 重点项目专班智慧化管理平台</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="particles"></canvas>
    <div class="grid-bg"></div>

    <!-- ================= 头部 ================= -->
    <header class="hd">
      <div class="hd-left">
        <div class="logo-ring">
          <svg viewBox="0 0 120 120">
            <defs>
              <path id="txtCircle" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"></path>
            </defs>
            <g class="ring-spin">
              <circle cx="60" cy="60" r="56" fill="none" stroke="rgba(56,230,255,.45)" stroke-width="1" stroke-dasharray="9 7"></circle>
              <text font-size="9.5" fill="#8ff4ff" letter-spacing="1.6">
                <textPath xlink:href="#txtCircle" href="#txtCircle" startOffset="0">安徽淮北杜集经济开发区 · DUJI DEVELOPMENT ZONE ·</textPath>
              </text>
            </g>
            <g class="ring-spin-rev">
              <circle cx="60" cy="60" r="34" fill="none" stroke="#38e6ff" stroke-width="1.6" stroke-dasharray="2 10" opacity=".85"></circle>
            </g>
            <polygon points="60,30 84,44 84,74 60,88 36,74 36,44" fill="rgba(24,180,255,.10)" stroke="rgba(56,230,255,.75)" stroke-width="1.4"></polygon>
            <circle cx="60" cy="60" r="4.5" fill="#18f5b0"></circle>
          </svg>
        </div>
        <div class="park-name" id="parkName">安徽淮北杜集经济开发区<small>DUJI ECONOMIC DEVELOPMENT ZONE</small></div>
      </div>

      <div class="hd-title">
        <h1 id="mainTitle">重点项目专班智慧化管理平台</h1>
        <div class="sub" id="subTitle"></div>
        <div class="deco"></div>
      </div>

      <div class="hd-right">
        <div class="clock" id="clock">00:00:00</div>
        <div class="clock-date" id="clockDate"></div>
      </div>
    </header>

    <!-- ================= 顶部 KPI ================= -->
    <div class="kpi-row" id="kpiRow"></div>

    <!-- ================= 主体三栏 ================= -->
    <main class="grid">
      <!-- 左栏 -->
      <section class="col col-left">
        <div class="panel h210">
          <div class="panel-head"><i></i><h3>项目结构</h3><em>STRUCTURE</em></div>
          <div class="panel-body"><div class="rings" id="rings"></div></div>
        </div>

        <div class="panel h250">
          <div class="panel-head"><i></i><h3>手续办理进度</h3><em>APPROVAL PROGRESS</em></div>
          <div class="panel-body"><div class="bars" id="bars"></div></div>
        </div>

        <div class="panel flex1">
          <div class="panel-head"><i></i><h3>在办项目动态</h3><em>LIVE STATUS</em></div>
          <div class="panel-body"><div class="card-wrap" id="cardWrap"></div></div>
        </div>
      </section>

      <!-- 中栏 -->
      <section class="col col-center">
        <div class="now-bar" id="nowBar">
          <span class="nb-seq">01</span>
          <span class="nb-name">—</span>
          <span class="nb-item"><em>投资方</em><b>—</b></span>
          <span class="nb-item"><em>联系人</em><b>—</b></span>
          <span class="nb-item"><em>手续</em><b>—</b></span>
          <span class="nb-st">已投产</span>
        </div>

        <div class="panel map-panel">
          <div class="map-head"><i></i><h3>土地利用现状与项目分布</h3><em>安徽淮北杜集经济开发区 · 园区规划范围</em></div>
          <div class="map-frame">
            <img id="mapImg" src="images/land-use-map.png" alt="土地利用现状图">
            <div class="map-scan"></div>
            <div class="map-legend">
              <span><i style="background:#18f5b0"></i>已供项目</span>
              <span><i style="background:#0b7c68"></i>规划绿地</span>
              <span><i style="background:#ffc42e"></i>已批未供</span>
              <span><i style="background:#1e9bff"></i>已供未建</span>
              <span><i style="background:#6e55d8"></i>其他用地</span>
              <span><i style="background:#25c8ff"></i>水域</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 右栏 -->
      <section class="col col-right">
        <div class="panel h350">
          <div class="panel-head"><i></i><h3>专班项目名录</h3><em>PROJECT LIST</em></div>
          <div class="panel-body" style="padding:2px 6px;"><div class="list" id="list"><div class="list-inner" id="listInner"></div></div></div>
        </div>

        <div class="panel flex1">
          <div class="panel-head"><i></i><h3>节点推进时间轴</h3><em>TIMELINE</em></div>
          <div class="panel-body" style="padding:8px 12px;"><div class="tl" id="tl"><div class="tl-inner" id="tlInner"></div></div></div>
        </div>

        <div class="panel h150">
          <div class="panel-head"><i></i><h3>需协调解决问题</h3><em>ISSUES</em></div>
          <div class="panel-body" style="padding:8px 10px;overflow:hidden;"><div class="issues" id="issues"></div></div>
        </div>
      </section>
    </main>

    <!-- ================= 底部 ================= -->
    <footer class="ft">
      <div class="badge"><i></i>专班调度动态</div>
      <div class="marquee"><div class="marquee-inner" id="marqueeInner"></div></div>
    </footer>
    <div class="stamp" id="stamp"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/particles.js"></script>
<script src="js/main.js"></script>
</body>
</html>
